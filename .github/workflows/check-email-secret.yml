name: Check email secret

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check EMAIL_PASSWORD
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          if [ -n "$EMAIL_PASSWORD" ]; then
            echo "EMAIL_PASSWORD is set"
          else
            echo "EMAIL_PASSWORD is missing or empty"
            exit 1
          fi
